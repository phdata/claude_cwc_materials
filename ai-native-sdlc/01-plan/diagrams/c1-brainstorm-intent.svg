<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 223"><title>Interview loop</title><rect width="100%" height="100%" fill="#ffffff"/><g class="node"><rect x="38.0" y="10.0" width="250.0" height="66.5" rx="9" fill="#ffffff" stroke="#94A3B8" stroke-width="1.5"/><text x="163.0" y="31.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937">Claude asks one question</text><text x="163.0" y="49.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">about a section the template still</text><text x="163.0" y="63.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">needs</text></g><g class="node"><rect x="472.0" y="10.0" width="250.0" height="66.5" rx="9" fill="#E3F5EE" stroke="#1baf7a" stroke-width="3"/><text x="597.0" y="31.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#0B5A3F">D. Okafor answers</text><text x="597.0" y="49.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#1F5A47">in her own words, with the numbers</text><text x="597.0" y="63.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#1F5A47">she knows</text></g><g class="node"><rect x="472.0" y="146.5" width="250.0" height="66.5" rx="9" fill="#ffffff" stroke="#94A3B8" stroke-width="1.5"/><text x="597.0" y="167.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937">Claude checks the notes</text><text x="597.0" y="186.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">docs/context/ settles facts; gaps go</text><text x="597.0" y="200.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">back as questions</text></g><g class="node"><rect x="38.0" y="146.5" width="250.0" height="66.5" rx="9" fill="#ffffff" stroke="#94A3B8" stroke-width="1.5"/><text x="163.0" y="167.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937">Next empty section</text><text x="163.0" y="186.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">problem, outcome, users, constraints,</text><text x="163.0" y="200.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">success, open questions</text></g><line x1="292.0" y1="43.2" x2="460.0" y2="43.2" stroke="#52606D" stroke-width="1.6"/><polygon points="468.0,43.2 460.0,38.8 460.0,47.8" fill="#52606D"/><line x1="597.0" y1="80.5" x2="597.0" y2="134.5" stroke="#52606D" stroke-width="1.6"/><polygon points="597.0,142.5 601.5,134.5 592.5,134.5" fill="#52606D"/><line x1="468.0" y1="179.8" x2="300.0" y2="179.8" stroke="#52606D" stroke-width="1.6"/><polygon points="292.0,179.8 300.0,184.2 300.0,175.2" fill="#52606D"/><line x1="163.0" y1="142.5" x2="163.0" y2="88.5" stroke="#52606D" stroke-width="1.6"/><polygon points="163.0,80.5 158.5,88.5 167.5,88.5" fill="#52606D"/><text x="380.0" y="101.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#334155" font-weight="700">Repeat until every section</text><text x="380.0" y="115.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#334155" font-weight="700">can be filled. No solution</text><text x="380.0" y="129.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#334155" font-weight="700">yet.</text></svg>
