<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 315"><title>Anatomy of intent/0001-ticket-triage.md</title><rect width="100%" height="100%" fill="#ffffff"/><text x="123.0" y="14.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#64748B" font-weight="700">intent/0001-ticket-triage.md</text><g class="node"><rect x="8.0" y="22.0" width="230.0" height="40.0" rx="9" fill="#E3F5EE" stroke="#1baf7a" stroke-width="3"/><text x="123.0" y="45.8" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#0B5A3F">Problem</text></g><text x="262.0" y="39.0" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">What happens today, with the originator's numbers: 1,800 tickets a day, 1 in 6</text><text x="262.0" y="53.0" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">misrouted</text><line x1="244.0" y1="42.0" x2="256.0" y2="42.0" stroke="#CBD5E1" stroke-width="1.5"/><g class="node"><rect x="8.0" y="68.0" width="230.0" height="34.5" rx="9" fill="#ffffff" stroke="#94A3B8" stroke-width="1.5"/><text x="123.0" y="89.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937">Proposed outcome</text></g><text x="262.0" y="89.2" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">What changes for agents and customers when this works</text><line x1="244.0" y1="85.2" x2="256.0" y2="85.2" stroke="#CBD5E1" stroke-width="1.5"/><g class="node"><rect x="8.0" y="108.5" width="230.0" height="34.5" rx="9" fill="#ffffff" stroke="#94A3B8" stroke-width="1.5"/><text x="123.0" y="129.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937">Affected users and systems</text></g><text x="262.0" y="129.8" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">Tier-1 and tier-2 agents, helpdesk platform, PII library, warehouse</text><line x1="244.0" y1="125.8" x2="256.0" y2="125.8" stroke="#CBD5E1" stroke-width="1.5"/><g class="node"><rect x="8.0" y="149.0" width="230.0" height="34.5" rx="9" fill="#E3F5EE" stroke="#1baf7a" stroke-width="3"/><text x="123.0" y="170.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#0B5A3F">Constraints</text></g><text x="262.0" y="170.2" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">The policy the design must honor: PII, untrusted input, safety, cost</text><line x1="244.0" y1="166.2" x2="256.0" y2="166.2" stroke="#CBD5E1" stroke-width="1.5"/><g class="node"><rect x="8.0" y="189.5" width="230.0" height="34.5" rx="9" fill="#ffffff" stroke="#94A3B8" stroke-width="1.5"/><text x="123.0" y="210.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937">Success looks like</text></g><text x="262.0" y="210.8" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">Measurable: misroutes under 1 in 10, P1 in under 5 minutes</text><line x1="244.0" y1="206.8" x2="256.0" y2="206.8" stroke="#CBD5E1" stroke-width="1.5"/><g class="node"><rect x="8.0" y="230.0" width="230.0" height="34.5" rx="9" fill="#ffffff" stroke="#94A3B8" stroke-width="1.5"/><text x="123.0" y="251.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937">Open questions</text></g><text x="262.0" y="251.2" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">Each one names who answers it, or is carried to the spec</text><line x1="244.0" y1="247.2" x2="256.0" y2="247.2" stroke="#CBD5E1" stroke-width="1.5"/><g class="node"><rect x="8.0" y="270.5" width="230.0" height="34.5" rx="9" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="123.0" y="291.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Gate decision</text></g><text x="262.0" y="291.8" text-anchor="start" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">Filled in by the product owner on accept or reject</text><line x1="244.0" y1="287.8" x2="256.0" y2="287.8" stroke="#CBD5E1" stroke-width="1.5"/></svg>
