<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 195"><title>The PR fix loop</title><rect width="100%" height="100%" fill="#ffffff"/><g class="node"><rect x="38.0" y="10.0" width="250.0" height="52.5" rx="9" fill="#FDEBE3" stroke="#eb6834" stroke-width="1.5"/><text x="163.0" y="31.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#8A3510">✕ Finding marked Important</text><text x="163.0" y="49.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#6F3A20">from the REVIEW.md pass</text></g><g class="node"><rect x="472.0" y="10.0" width="250.0" height="52.5" rx="9" fill="#F1F4F8" stroke="#52606D" stroke-width="1.5"/><text x="597.0" y="31.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937">@claude, or the local loop</text><text x="597.0" y="49.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#3E4A57">fix this finding</text></g><g class="node"><rect x="472.0" y="132.5" width="250.0" height="52.5" rx="9" fill="#ffffff" stroke="#94A3B8" stroke-width="1.5"/><text x="597.0" y="153.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#1F2937">One commit per finding</text><text x="597.0" y="172.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#475569">small and reviewable</text></g><g class="node"><rect x="38.0" y="132.5" width="250.0" height="52.5" rx="9" fill="#E6EFFB" stroke="#2a78d6" stroke-width="1.5"/><text x="163.0" y="153.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#164A8A">✓ Reply with the hash</text><text x="163.0" y="172.0" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#28456E">under the finding</text></g><line x1="292.0" y1="36.2" x2="460.0" y2="36.2" stroke="#52606D" stroke-width="1.6"/><polygon points="468.0,36.2 460.0,31.8 460.0,40.8" fill="#52606D"/><line x1="597.0" y1="66.5" x2="597.0" y2="120.5" stroke="#52606D" stroke-width="1.6"/><polygon points="597.0,128.5 601.5,120.5 592.5,120.5" fill="#52606D"/><line x1="468.0" y1="158.8" x2="300.0" y2="158.8" stroke="#52606D" stroke-width="1.6"/><polygon points="292.0,158.8 300.0,163.2 300.0,154.2" fill="#52606D"/><line x1="163.0" y1="128.5" x2="163.0" y2="74.5" stroke="#52606D" stroke-width="1.6"/><polygon points="163.0,66.5 158.5,74.5 167.5,74.5" fill="#52606D"/><text x="380.0" y="94.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#334155" font-weight="700">Nits stay capped. A human</text><text x="380.0" y="108.5" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#334155" font-weight="700">still approves the PR.</text></svg>
