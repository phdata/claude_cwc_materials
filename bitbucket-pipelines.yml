image: python:3.12

definitions:
  caches:
    pip: ~/.cache/pip

pipelines:
  branches:
    main:
      - step:
          name: Mirror to GitHub
          clone:
            depth: full
          caches:
            - pip
          script:
            - pip install pyjwt cryptography
            - GH_TOKEN=$(python bin/github-app-token.py)
            - git remote add github "https://x-access-token:${GH_TOKEN}@github.com/phdata/claude_cwc_materials.git"
            - git push --force github HEAD:main
            - git push --force github --tags
